[[optional_value]]
venue = "binance"
field = "liquidationPrice"
absent_when = "The position has no liquidation price; Binance reports 0"
representation = "N/A with the reason; never estimated"
source = "docs/futures-venues.md#stops-and-liquidation"

[[optional_value]]
venue = "bybit"
field = "liqPrice"
absent_when = "Portfolio margin, or outside the price limits; Bybit leaves it empty"
representation = "N/A with the reason; never estimated"
source = "docs/futures-venues.md#stops-and-liquidation"

[[optional_value]]
venue = "bybit"
field = "kline trade count"
absent_when = "Bybit's klines carry no trade count"
representation = "Unknown: None in candles, and known = 0 in segments"
source = "docs/segment-spec.md"

[[optional_value]]
venue = "bybit"
field = "position stop client ID"
absent_when = "Bybit's position stops carry no client ID"
representation = "Identified by the position's stopLoss; ownership comes from the ledger"
source = "docs/futures-venues.md#order-identity-and-retention"

[[optional_value]]
venue = "bybit"
field = "position stop trigger basis"
absent_when = "/v5/position/list reports the stop's price but not its trigger basis"
representation = "Read from the order view, or ALG-741 uses a stop whose basis can be read; never assumed (unverified item 5)"
source = "docs/futures-venues.md#unverified-items"

[[optional_value]]
venue = "bybit"
field = "inverse face value"
absent_when = "No instrument field carries it"
representation = "F = 1 USD, from Bybit's documented rule"
source = "docs/futures-venues.md#units"

[[optional_value]]
venue = "binance"
field = "COIN-M minimum notional"
absent_when = "COIN-M instruments have no minimum-notional filter"
representation = "No notional check; the minimum quantity still applies"
source = "docs/futures-venues.md#units"

[[optional_value]]
venue = "binance"
field = "acknowledgement fills"
absent_when = "Since 2026-06-30 Binance's futures acknowledgements carry no fills"
representation = "Fills come from order queries, fill records or private events"
source = "docs/futures-venues.md#order-identity-and-retention"

[[optional_value]]
venue = "binance"
field = "futures account ID"
absent_when = "A key may expose no stable account ID (unverified item 3)"
representation = "Outside mainnet a key fingerprint stands in; mainnet arming is refused"
source = "docs/adr/0002-automation-architecture.md"

