# Artifacts and what each promises. A cell of release.artifact takes its
# surfaces and backends from here.
[[artifact]]
id = "binary"
title = "The quantforge binary"
surfaces = ["cli", "server"]
backends = ["sqlite", "postgres"]
published = true
platforms = ["linux", "macos", "windows"]
requirement = "Built with default features: the postgres feature is on and both venues are registered"

[[artifact]]
id = "image"
title = "The OCI image"
surfaces = ["server", "cli"]
backends = ["sqlite", "postgres"]
published = true
platforms = ["linux/amd64", "linux/arm64"]
requirement = "The binary with default features, running non-root, with its store and secrets supplied by the deployment"

[[artifact]]
id = "wheel"
title = "The Python wheel"
surfaces = ["python"]
backends = ["sqlite", "postgres"]
published = true
platforms = ["linux", "macos", "windows"]
requirement = "Local and remote Python workflows on both stores, with PostgreSQL pools held by the trusted host; no webhook or Telegram API"

[[artifact]]
id = "sqlite-build"
title = "The SQLite-only build"
surfaces = ["cli", "server"]
backends = ["sqlite"]
published = false
platforms = []
requirement = "Built with --no-default-features; supported separately and labelled as such, never published as a full artifact"

