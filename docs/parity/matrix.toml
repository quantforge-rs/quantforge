# The v0.3 capability parity matrix: what QuantForge 0.3 must do on Binance and
# Bybit, with SQLite and PostgreSQL, for each product family. ALG-756 froze it
# on 2026-10-22, and ALG-769 holds the release until every cell has passing
# evidence.
#
# README.md explains the rules and matrix.md renders this file. Check both with
# `cargo test --test parity`; refresh matrix.md and cells.txt with
# `UPDATE_SNAPSHOTS=1 cargo test --test parity`. Reducing coverage needs a
# scope change recorded below, and every change to the cells bumps `revision`.

format = 1
revision = 1
source_date = "2026-10-22"
release = "0.3.0"

# Gates that consume the evidence. They never own it.
consumers = ["ALG-535", "ALG-711", "ALG-719", "ALG-731", "ALG-755"]

# Cell IDs join a capability's values in this order: artifact, surface, venue,
# backend, family, side. Values are unique across axes.
[axes]
artifact = ["binary", "image", "wheel", "sqlite-build"]
surface = ["cli", "server", "python"]
venue = ["binance", "bybit"]
backend = ["sqlite", "postgres"]
family = ["spot", "linear", "inverse"]
side = ["long", "short"]

