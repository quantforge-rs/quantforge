# Units and number rules. Areas name the ones their values use.
[units]
price = "Decimal in the quote asset, on the instrument's tick"
base_qty = "Decimal in the base asset, on the instrument's step (Spot and linear)"
contracts = "Whole inverse contracts; face value F is the venue's (Binance contractSize, 100 or 10 USD; Bybit 1 USD)"
quote_amount = "Decimal in the quote asset"
money = "Decimal with its asset code; amounts in different assets are never summed"
fee = "Decimal with the asset the venue charged it in"
funding = "Decimal in the settlement asset: received is positive, paid negative"
pnl = "Realized PnL in the settlement asset, net: gross minus fees plus funding"
leverage = "Decimal multiplier, within the venue's bracket for the notional"
percent = "Decimal percent: risk_percent 1 means 1 %"
fraction = "Decimal fraction: taker_fee 0.0005 means 0.05 %"
timestamp = "UTC epoch milliseconds"
interval = "Interval token, such as 1m or 1d"
hash = "sha256 followed by 64 lowercase hex digits"
rounding = "Stops round to the tick away from the entry; quantities floor to the step; coin amounts round half-even to 12 places; returns round half-even to 8 places"
exactness = "Decimals are exact text that keeps its scale; an amount the venue did not report stays unknown, never zero"

# Error vocabularies. `exchange` is ExchangeErrorKind, `wire` is the protocol's
# ErrorCode, `refusal` names every reason a request is refused before or
# instead of reaching a venue.
[errors]
exchange = ["transport", "invalid_response", "invalid_request", "missing_credentials", "unauthorized", "clock_skew", "rate_limited", "unavailable", "outcome_unknown", "unknown_symbol", "unknown_order", "insufficient_balance", "rule_violation", "rejected", "other"]
storage = ["unavailable", "outcome_unknown", "invalid_argument", "schema_unsupported", "other"]
wire = ["invalid_request", "unauthorized", "not_found", "conflict", "unsupported_version", "limit_exceeded", "rate_limited", "unavailable", "internal"]
refusal = ["no_capital_in_settlement_asset", "stop_wrong_side", "no_stop", "below_min_qty", "above_market_max", "below_min_notional", "above_leverage_bracket", "insufficient_margin", "settlement_wallet_below_risk", "stop_crossed", "risk_drift", "stale", "future_timestamp", "not_armed", "conflict", "pyramiding", "reversal", "unowned_position", "unresolved_entry", "incident_open", "hedge_mode", "portfolio_margin", "unsupported_account", "ambiguous_selection", "environment_mismatch", "unknown_ticker", "outside_universe"]

# Normalized state machines. Spot orders use OrderStatus's names, jobs the
# protocol's kinds; the futures machines extend ADR 0002 §1 with the terminal
# states it implies.
[states.spot_order]
initial = "PENDING_NEW"
states = ["PENDING_NEW", "NEW", "PARTIALLY_FILLED", "FILLED", "CANCELED", "REJECTED", "EXPIRED"]
terminal = ["FILLED", "CANCELED", "REJECTED", "EXPIRED"]
transitions = ["PENDING_NEW -> NEW", "PENDING_NEW -> PARTIALLY_FILLED", "PENDING_NEW -> FILLED", "PENDING_NEW -> CANCELED", "PENDING_NEW -> REJECTED", "PENDING_NEW -> EXPIRED", "NEW -> PARTIALLY_FILLED", "NEW -> FILLED", "NEW -> CANCELED", "NEW -> EXPIRED", "PARTIALLY_FILLED -> FILLED", "PARTIALLY_FILLED -> CANCELED", "PARTIALLY_FILLED -> EXPIRED"]

[states.spot_replace]
initial = "pending"
states = ["pending", "accepted", "partially_applied", "rejected", "outcome_unknown"]
terminal = ["accepted", "partially_applied", "rejected"]
transitions = ["pending -> accepted", "pending -> partially_applied", "pending -> rejected", "pending -> outcome_unknown", "outcome_unknown -> accepted", "outcome_unknown -> partially_applied", "outcome_unknown -> rejected"]

[states.job]
initial = "queued"
states = ["queued", "running", "succeeded", "failed", "cancelled"]
terminal = ["succeeded", "failed", "cancelled"]
transitions = ["queued -> running", "queued -> failed", "queued -> cancelled", "running -> succeeded", "running -> failed", "running -> cancelled"]

[states.strategy_run]
initial = "starting"
states = ["starting", "running", "stopped", "failed"]
terminal = ["stopped", "failed"]
transitions = ["starting -> running", "starting -> stopped", "starting -> failed", "running -> stopped", "running -> failed"]

[states.signal_intent]
initial = "received"
states = ["received", "admitted", "rejected", "duplicate", "noop", "expired", "submitting", "outcome_unknown", "not_placed", "partially_filled", "filled", "unfilled"]
terminal = ["rejected", "duplicate", "noop", "expired", "not_placed", "filled", "unfilled"]
transitions = ["received -> admitted", "received -> rejected", "received -> duplicate", "received -> noop", "admitted -> submitting", "admitted -> expired", "admitted -> rejected", "admitted -> noop", "submitting -> partially_filled", "submitting -> filled", "submitting -> unfilled", "submitting -> rejected", "submitting -> outcome_unknown", "outcome_unknown -> partially_filled", "outcome_unknown -> filled", "outcome_unknown -> unfilled", "outcome_unknown -> rejected", "outcome_unknown -> not_placed", "partially_filled -> filled"]

[states.futures_position]
initial = "protection_pending"
states = ["protection_pending", "protected", "protected_by_operator", "protection_unknown", "unprotected", "unprotected_by_operator", "closing", "closed"]
terminal = ["closed"]
transitions = ["protection_pending -> protected", "protection_pending -> protected_by_operator", "protection_pending -> protection_unknown", "protection_pending -> unprotected", "protection_pending -> closing", "protection_pending -> closed", "protected -> protection_pending", "protected -> protected_by_operator", "protected -> protection_unknown", "protected -> unprotected", "protected -> unprotected_by_operator", "protected -> closing", "protected -> closed", "protected_by_operator -> protection_pending", "protected_by_operator -> protection_unknown", "protected_by_operator -> unprotected_by_operator", "protected_by_operator -> closing", "protected_by_operator -> closed", "protection_unknown -> protection_pending", "protection_unknown -> protected", "protection_unknown -> protected_by_operator", "protection_unknown -> unprotected", "protection_unknown -> unprotected_by_operator", "protection_unknown -> closing", "protection_unknown -> closed", "unprotected -> protection_pending", "unprotected -> protected", "unprotected -> closing", "unprotected -> closed", "unprotected_by_operator -> protected_by_operator", "unprotected_by_operator -> closing", "unprotected_by_operator -> closed", "closing -> protected", "closing -> protection_unknown", "closing -> unprotected", "closing -> closed"]

[states.notification]
initial = "pending"
states = ["pending", "delivered", "outcome_unknown"]
terminal = ["delivered", "outcome_unknown"]
transitions = ["pending -> delivered", "pending -> outcome_unknown"]

[states.incident]
initial = "open"
states = ["open", "cleared"]
terminal = ["cleared"]
transitions = ["open -> cleared"]

[states.profile]
initial = "disarmed"
states = ["disarmed", "armed"]
terminal = []
transitions = ["disarmed -> armed", "armed -> disarmed"]

# The store activation contract (docs/storage-schema.md): a store executes
# only once an operator activates it; copies and transfers never carry that.
[states.store]
initial = "inactive"
states = ["inactive", "active", "deactivated"]
terminal = []
transitions = ["inactive -> active", "active -> deactivated", "deactivated -> active"]

[states.service]
initial = "stopped"
states = ["stopped", "starting", "running", "stopping"]
terminal = []
transitions = ["stopped -> starting", "starting -> running", "starting -> stopped", "running -> stopping", "stopping -> stopped"]

[states.accounting]
initial = "provisional"
states = ["provisional", "final"]
terminal = ["final"]
transitions = ["provisional -> final"]

# Frozen identity, account and signal choices. ADR 0002 decides them; ALG-733
# and the adapter stories implement them.
[policy]
reference = "ADR 0002 §2, §4 and §5"
environments = ["mainnet", "testnet", "demo"]
profile_identity = ["id", "account_ref", "category", "owner_tag"]
account_ref = ["venue", "environment", "venue_account_id"]
position_mode = "one-way"
margin_modes = ["isolated", "cross"]
refused_modes = ["hedge", "portfolio_margin", "bybit_unified_1_0"]
changes_account_settings = false
rules = ["The environment is declared, never inferred from a URL, and every store is bound to one", "Outside mainnet a key fingerprint may stand in for the venue account ID; mainnet arming needs the venue's ID", "Leverage is set only while the position is flat with no open orders, then read back", "At most one armed profile per account and category", "One active store per account; client order IDs carry the store's activation epoch", "An ambiguous venue, account, environment or product selection is refused"]

[policy.signals]
reference = "ADR 0002 §8, §9 and §10"
age_limit_default_s = 60
age_limit_min_s = 5
age_limit_max_s = 300
future_allowance_s = 5
drift_limit = "1.25"
propagation_delay_s = 30
settle_window_s = 60
repair_attempts = 3
protective_close_attempts = 3
attempt_window_s = 10
unprotected_alert_interval_s = 300
operator_move_window_s = 30

[policy.evidence]
reference = "ADR 0001; ADR 0002 §13"
environments = { "binance.spot" = ["testnet"], "binance.linear" = ["demo"], "binance.inverse" = ["demo"], "bybit" = ["demo", "testnet"] }
postgres_versions = ["16", "18"]
artifacts = "One passing record for every published file of an artifact, named by its digest"

# The product universe, rule 1 (ADR 0002 §3). The list records what the rule
# selected on its date; it is never an allowlist.
[universe]
rule_version = 1
list = "universe-v1-2026-10-22.json"
reference = "ADR 0002 §3"
environments = { binance = ["mainnet", "demo"], bybit = ["mainnet", "testnet", "demo"] }

[[universe.rule]]
venue = "binance"
family = "linear"
match = "contractType PERPETUAL, marginAsset USDT, status TRADING"

[[universe.rule]]
venue = "binance"
family = "inverse"
match = "contractType PERPETUAL, contractStatus TRADING"

[[universe.rule]]
venue = "bybit"
family = "linear"
match = "contractType LinearPerpetual, settleCoin USDT, status Trading"

[[universe.rule]]
venue = "bybit"
family = "inverse"
match = "contractType InversePerpetual, status Trading"

# Contracts for each area: what goes in and out, the states and errors it uses,
# its units, data quality and persistence, and how parity is compared.
[[area]]
id = "config"
title = "Configuration and routing"
inputs = "Flags, then environment variables, then a persisted profile: venue, product family, environment, account, storage backend and its URL, and secrets by reference"
outputs = "One resolved selection (venue, family, environment, account, store) that every later request and row carries"
states = ["profile"]
errors = ["refusal", "storage"]
units = []
quality = "Nothing is inferred: the environment is declared, never read from a URL; a missing, conflicting or ambiguous selection is refused before any network or storage access; secret values are never shown"
persistence = "A store is bound to one environment for its life; profiles keep their identity and settings and refer to secrets without holding them"
compare = "The same flags, precedence and refusals on every venue and store"

[[area]]
id = "strategy"
title = "Candle strategies"
inputs = "A strategy bundle or Python strategy, a Spot data series with its stored candles, and a backtest or trading configuration in Decimal"
outputs = "Trades, equity and metrics, with provenance: code hash, data hashes and configuration"
states = ["strategy_run", "job"]
errors = ["exchange", "storage", "wire"]
units = ["price", "base_qty", "quote_amount", "fee", "timestamp", "interval", "exactness"]
quality = "Closed bars only; in a backtest a target set on bar N fills at bar N+1's open, with no clock, randomness or I/O; linear and inverse series are refused"
persistence = "Runs, journals and job results live in the selected store and survive restarts"
compare = "Byte-identical results across stores and between local and remote runs (the ALG-383 goldens); across venues a result depends only on that venue's frozen candles"

[[area]]
id = "jobs"
title = "Server jobs"
inputs = "A canonical bundle (bundle format 1) and a data selection"
outputs = "Job status, logs, results and a provenance record"
states = ["job"]
errors = ["wire", "storage"]
units = ["hash", "timestamp"]
quality = "Workers never receive store credentials; a bundle is verified before it runs; results can be reproduced from their provenance"
persistence = "Jobs and results live in the selected store; a restart neither loses nor repeats a finished job"
compare = "Identical results and provenance on both stores"

[[area]]
id = "data"
title = "Market data"
inputs = "A data series key (venue, family, symbol, interval) and a time range"
outputs = "Settled candles, validation issues, immutable segments with their hashes, history responses, live closed bars and current prices"
states = []
errors = ["exchange", "storage", "wire"]
units = ["price", "base_qty", "contracts", "quote_amount", "timestamp", "interval", "hash", "exactness"]
quality = "Only settled, closed bars are stored, ascending and without duplicates; gaps are reported, never filled with invented bars; inverse volume stays in contracts; mark-price series never mix with trade-price candles; a family is never inferred from a symbol"
persistence = "Decimals keep their exact text; segments are append-only; syncing the same data again changes nothing"
compare = "Identical bytes and segment hashes across stores; matched page shapes, gaps and duplicates across venues"

[[area]]
id = "spot"
title = "Spot orders and accounts"
inputs = "Symbol, side, base quantity or quote amount, limit price, time in force (GTC, IOC or FOK), client order ID, and replacement intents"
outputs = "Normalized orders (venue ID as text, client ID, status, executed quantity and quote amount, fills with their fees), balances and trades"
states = ["spot_order", "spot_replace", "strategy_run"]
errors = ["exchange", "refusal", "storage"]
units = ["price", "base_qty", "quote_amount", "fee", "timestamp", "exactness"]
quality = "An acknowledgement is not a fill; an unknown outcome is queried before any retry; Spot never gains short positions, leverage or native futures protection"
persistence = "The position change is persisted before its journal event; journal rows are identical on both stores; PnL is never fabricated"
compare = "Identical journals across stores; matched order scenarios across venues"

[[area]]
id = "transport"
title = "Transport and errors"
inputs = "Requests to the hosts documented for the profile's environment"
outputs = "A response, or one typed error per failure"
states = []
errors = ["exchange"]
units = ["timestamp"]
quality = "Each venue's rate budget is respected and stays explicit; every venue error maps to exactly one kind; a request that may have executed is outcome_unknown"
persistence = "None"
compare = "The same error kinds for matched failures on both venues"

[[area]]
id = "futures"
title = "Futures adapters and the execution ledger"
inputs = "Instrument, account and position identities, the policy snapshot, an account snapshot and admitted signals"
outputs = "Instruments with their units; account and mode facts; positions with liquidation; leverage; sizing results; orders and fills; protection state; realized PnL"
states = ["signal_intent", "futures_position", "incident", "accounting"]
errors = ["exchange", "refusal", "storage"]
units = ["price", "base_qty", "contracts", "money", "fee", "funding", "pnl", "leverage", "percent", "fraction", "timestamp", "rounding", "exactness"]
quality = "Universe rule 1; rules come from the environment being traded; stops trigger on the mark price; liquidation is the venue's value or N/A with a reason, never an estimate; nothing is called protected or flat without the exchange's evidence"
persistence = "Intents, fills, positions, protection and incidents live in the execution store; no transaction spans a network request; state survives a restart"
compare = "Identical ledger rows across stores for identical frozen inputs; matched fixtures across venues give the same states, transitions and errors, never the same prices, fees or PnL"

[[area]]
id = "automation"
title = "Automation service"
inputs = "Authenticated TradingView deliveries, CLI commands and profile settings"
outputs = "Inbox and outbox records, Telegram messages and CLI status"
states = ["signal_intent", "notification", "profile", "service", "incident"]
errors = ["refusal", "storage", "wire"]
units = ["money", "pnl", "percent", "timestamp"]
quality = "A 2xx answer means only that the inbox commit happened, within TradingView's 3 s; an acknowledgement is not a fill and a fill is not protection; secrets are held by reference"
persistence = "Inbox, outbox and profiles are durable; a normal stop leaves positions and native stops in place"
compare = "Identical records across stores; the same workflow on both venues"

[[area]]
id = "storage"
title = "Storage backends"
inputs = "The storage ports' operations"
outputs = "The same results from SQLite and PostgreSQL"
states = ["store"]
errors = ["storage"]
units = ["timestamp", "hash", "exactness"]
quality = "Durable commits and bounded waits; never a hidden fallback to another backend"
persistence = "Migrations never delete data; every earlier schema moves forward; transfers are verified"
compare = "One shared conformance suite gives identical results on both backends"

[[area]]
id = "release"
title = "Release artifacts"
inputs = "Candidate binaries, wheels and OCI images, and the SQLite-only build"
outputs = "Smoke results per surface, venue and backend, for every published file"
states = []
errors = []
units = ["hash"]
quality = "Full artifacts carry the postgres feature and both venues; a PostgreSQL deployment leaves no SQLite file; the Python SDK has no webhook or Telegram API"
persistence = "None"
compare = "Every published file of an artifact passes the same cells"

# Capabilities. `axes` are the spanned axes; `only` narrows one for a domain
# reason, never for missing work. A cell's owners are the union of every key
# whose dot-separated parts are all among its values, plus `all`.

[[capability]]
id = "config.select"
area = "config"
title = "Select the venue, family, environment, account and store"
axes = ["venue", "backend", "family"]
passes = "Selecting each cell by flag, by environment variable and by profile reaches that venue, family and store, with the flag winning; a missing, conflicting or ambiguous selection is refused before any network or storage access"
requires = ["replay", "real_store"]
revised = 1
requirements = ["OBS-R008"]
implementation = { all = ["ALG-401", "ALG-750"], binance = ["ALG-684"], "binance.linear" = ["ALG-759"], "binance.inverse" = ["ALG-759"], bybit = ["ALG-693", "ALG-694"], linear = ["ALG-767"], inverse = ["ALG-767"] }
evidence = { all = ["ALG-769"], spot = ["ALG-702"], linear = ["ALG-742"], inverse = ["ALG-742"] }

[[capability]]
id = "config.secrets"
area = "config"
title = "Hold credentials and tokens by reference, redacted"
axes = ["venue", "backend"]
passes = "Credentials and tokens resolve only from flags, environment variables or a profile's secret reference; no value appears in output, logs, the database, notifications or workers, and every one shown is redacted"
requires = ["replay", "real_store", "artifact"]
revised = 1
requirements = ["OBS-R072", "D23"]
implementation = { all = ["ALG-750", "ALG-754"], binance = ["ALG-499", "ALG-759"], bybit = ["ALG-694"] }
evidence = { all = ["ALG-754"] }

[[capability]]
id = "config.environment"
area = "config"
title = "Bind each store to one environment"
axes = ["backend"]
passes = "A store records its environment once; a connector or profile for another environment is refused before any write, and a store from an older release is declared by its operator, never guessed"
requires = ["real_store"]
revised = 1
implementation = { all = ["QUA-37"] }
evidence = { all = ["ALG-748"] }

[[capability]]
id = "config.storage"
area = "config"
