# A spike for ADR 0001 (docs/adr/0001-postgres-client-strategy.md): the
# PostgreSQL bridge behind QuantForge's synchronous storage ports, exercised
# from the contexts that call them. Not part of the published crate.
[package]
name = "postgres-bridge-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Its own workspace, so that it never joins the quantforge package's.
[workspace]

[features]
python = ["dep:pyo3", "dep:pyo3-build-config"]

[dependencies]
deadpool-postgres = "0.14"
quantforge = { path = "../.." }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
url = "2"
rust_decimal = "1"
pyo3 = { version = "0.30", features = ["auto-initialize"], optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.30", optional = true }

[dev-dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
postgres = "0.19"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "python"
harness = false
required-features = ["python"]
