[package]
name = "quantforge"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic CLI-first market data ingestion, backtesting, and controlled live trading framework in Rust."
license = "MIT"
repository = "https://github.com/quantforge-rs/quantforge"
homepage = "https://github.com/quantforge-rs/quantforge"
readme = "README.md"
keywords = ["trading", "backtesting", "quant", "cli", "binance"]
categories = ["command-line-utilities", "finance"]
exclude = [
  ".github/",
  "scripts/",
  "spikes/",
]

[lib]
name = "quantforge"
path = "src/lib.rs"

[[bin]]
name = "quantforge"
path = "src/main.rs"

[features]
default = ["postgres"]
# PostgreSQL storage (docs/adr/0001-postgres-client-strategy.md): the bridge,
# its pool and TLS. Without it the build is SQLite only, and selecting
# postgres is refused.
postgres = [
  "dep:deadpool-postgres",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:tokio-postgres",
  "dep:tokio-postgres-rustls",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
# ws: the log stream of a backtest job, the server's first WebSocket route.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = { version = "0.14", optional = true }
hex = "0.4"
hmac = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde", "std"] }
# The ring provider, as reqwest's rustls-tls uses: no OpenSSL, no aws-lc-rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"], optional = true }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Without the defaults: no decoders for zstd's pre-1.0 formats.
zstd = { version = "0.14", default-features = false }

# A job worker's limits, the process group it runs in, and closing every
# descriptor it was given but its three pipes.
[target.'cfg(unix)'.dependencies]
close_fds = "0.3"
rustix = { version = "1", features = ["fs", "process"] }

# A job worker's sandbox on Linux: files confined to its scratch directory
# (Landlock), and no sockets (seccomp, which names syscalls by libc's numbers).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

[dev-dependencies]
assert_cmd = "2"
# Reads and writes a WebSocket stream in the log stream's tests; in the
# lock already.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
predicates = "3"
# raw_value keeps a recorded response body byte for byte in a fixture.
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
# The WebSocket client of the log stream's tests: the tungstenite axum's ws
# feature already brings, so no package joins the lock for them.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
