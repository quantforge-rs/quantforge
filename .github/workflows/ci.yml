name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # branch protection requires these checks by name (docs/ci.md): the name
    # follows the platform, whichever runner the platform runs on
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # windows, the slowest leg, runs on the organization's larger runner
        # (8 cores); the other legs run on the runner their name says
        include:
          - os: windows-latest
            runner: windows-latest-l
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # the size budget runs on the linux leg only (line counts are the same on
      # every platform) and inside this required job, so a failure blocks merging
      # without a branch protection change
      - name: file-size
        if: runner.os == 'Linux'
        run: ./scripts/file-size-check.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # the sqlite-only build, which holds no postgresql code (adr 0001)
      - name: clippy (sqlite only)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: test
        run: cargo test --all-features --locked
      - name: test (sqlite only)
        run: cargo test --no-default-features --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the oldest rust the crate declares (`rust-version`), with and without
      # the default features: adr 0001's msrv check, in a job already required
      - uses: dtolnay/rust-toolchain@1.85
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: msrv
        run: cargo +1.85 check --locked --all-targets
      - name: msrv (sqlite only)
        run: cargo +1.85 check --locked --all-targets --no-default-features
      - name: package
        run: cargo publish --dry-run --locked

  # the whole suite against each postgresql major adr 0001 supports, on the
  # official images as service containers (docs/ci.md). the required variable
  # turns a test that would skip for want of a server into a failure
  postgres:
    name: postgres ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ["16", "17", "18"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # tls is turned on once it runs, under a ca made for the run
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: test-pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # over tcp: on its first start the image runs a server on its socket
        # alone, and stops it before starting the real one
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U quant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # fsync off, for the refusal of a server that cannot keep its commits
      weak:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: test-pw
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U quant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: servers
        run: ./scripts/postgres-test-servers.sh configure "$SERVER" "$WEAK" "$RUNNER_TEMP/postgres-tls"
        env:
          SERVER: ${{ job.services.postgres.id }}
          WEAK: ${{ job.services.weak.id }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --all-features --locked --no-fail-fast
        env:
          QUANTFORGE_TEST_POSTGRES_REQUIRED: "1"
          QUANTFORGE_TEST_POSTGRES_URL: postgres://quant:test-pw@127.0.0.1:5432/postgres?sslmode=disable
          QUANTFORGE_TEST_POSTGRES_TLS_URL: postgres://quant:test-pw@localhost:5432/postgres?sslmode=verify-full&sslrootcert=${{ runner.temp }}/postgres-tls/ca.crt
          QUANTFORGE_TEST_POSTGRES_WEAK_URL: postgres://quant:test-pw@127.0.0.1:5433/postgres?sslmode=disable
      - name: nothing left behind
        run: ./scripts/postgres-test-servers.sh leftovers "$SERVER" "$WEAK"
        env:
          SERVER: ${{ job.services.postgres.id }}
          WEAK: ${{ job.services.weak.id }}

  # the one required check for the postgres legs, so a major added to or
  # dropped from the matrix needs no branch protection change. it runs even
  # when a leg failed or was cancelled: a required check that is skipped
  # counts as passed
  storage:
    needs: postgres
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every postgres leg passed
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.postgres.result }}

  # the python package (docs/python-package.md): the extension crate's lints
  # and its oldest rust, then the wheel maturin builds, installed and tested
  # on each python named, the sqlite-only wheel and the in-place install.
  # scripts/python-package-check.sh is the whole of it, here and locally
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # the candle reader's tests write a store here with the command line,
      # beside the sqlite one, and read both from python
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: test-pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # over tcp: on its first start the image runs a server on its socket
        # alone, and stops it before starting the real one
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U quant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # the oldest python the package supports and the newest released: one
      # wheel has to load on both. raise the newest as a new one is released
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.15
      # the oldest rust the crate declares, as in the package job
      - uses: dtolnay/rust-toolchain@1.85
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: ./scripts/python-package-check.sh python3.11 python3.15
        env:
          QUANTFORGE_TEST_POSTGRES_REQUIRED: "1"
          QUANTFORGE_TEST_POSTGRES_URL: postgres://quant:test-pw@127.0.0.1:5432/postgres?sslmode=disable

  # the python package's wheel of each platform (docs/ci.md, the wheels):
  # built for release as it would be published, then installed and tested on
  # the platform it is for, and kept with the run.
  # scripts/python-wheel-check.sh tests a wheel, here and locally
  wheel:
    # branch protection requires these checks by name (docs/ci.md), and
    # `wheels` beside them
    name: wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # github runs service containers on linux alone: the linux leg has
        # a postgresql server for the candle reader's tests, and on the
        # other legs the service's image is empty, which starts none
        include:
          - os: ubuntu-latest
            postgres: postgres:18
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # git bash on windows: one script on every leg
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: test-pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # over tcp: on its first start the image runs a server on its socket
        # alone, and stops it before starting the real one
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U quant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # the oldest python the package supports and the newest released, as
      # in the python job, each named to the check by its path: windows has
      # no python3.11 to name
      - uses: actions/setup-python@v7
        id: oldest
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v7
        id: newest
        with:
          python-version: "3.15"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # with the maturin pyproject.toml asks for, and the crate's default
      # features, both stores, as every published artifact has them: on
      # linux in a manylinux_2_28 container, so that the wheel loads on any
      # linux with glibc 2.28 or later, and on macos and windows on the
      # runner. `--compatibility pypi` fails a wheel pypi would refuse. the
      # wheel's target directory is its own: before building in the
      # container the action removes the build scripts of the one it builds
      # in, which the command line's build on the runner needs
      - name: build
        uses: PyO3/maturin-action@v1
        with:
          args: --release --manifest-path quantforge-py/Cargo.toml --target-dir target/wheel --out dist --compatibility pypi
          manylinux: "2_28"
      - name: test
        run: ./scripts/python-wheel-check.sh dist "$OLDEST" "$NEWEST"
        env:
          OLDEST: ${{ steps.oldest.outputs.python-path }}
          NEWEST: ${{ steps.newest.outputs.python-path }}
          # on linux the job's server, which has to be tested; on the other
          # legs both are empty, as if unset, and those tests skip
          QUANTFORGE_TEST_POSTGRES_REQUIRED: ${{ matrix.postgres && '1' || '' }}
          QUANTFORGE_TEST_POSTGRES_URL: ${{ matrix.postgres && 'postgres://quant:test-pw@127.0.0.1:5432/postgres?sslmode=disable' || '' }}
      # the wheel that passed, one artifact for each platform; a leg run
      # again keeps the wheel it built in the place of the one before
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true

  # the one required check for the wheel legs, as storage is for the
  # postgres legs: a platform added to the matrix or dropped from it needs
  # no branch protection change. it runs even when a leg failed or was
  # cancelled: a required check that is skipped counts as passed
  wheels:
    needs: wheel
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every wheel leg passed
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.wheel.result }}
