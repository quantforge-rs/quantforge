[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "quantforge-py"
description = "QuantForge for Python: strategies written in Python, run on the deterministic Rust engine."
readme = "README.md"
# The stable ABI of 3.11 (the crate's `abi3-py311`): a wheel loads on 3.11 and
# every later CPython.
requires-python = ">=3.11"
license = "MIT"
keywords = ["trading", "backtesting", "quant"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Investment",
]
# The crate's version (Cargo.toml), which is the package's own.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/quantforge-rs/quantforge"
Documentation = "https://github.com/quantforge-rs/quantforge/blob/main/docs/python-package.md"
Changelog = "https://github.com/quantforge-rs/quantforge/blob/main/CHANGELOG.md"

# The package itself requires nothing but Python. NumPy is its one extra,
# `pip install "quantforge-py[numpy]"`, for `CandleBatch.to_numpy`, which
# gives arrays of it, and `from_numpy`, which reads them. 2.0 is the oldest
# the tests run on, and 3 is left out until there is one to test on: the
# array bindings would read it as a NumPy 2. The package imports NumPy when
# one of the two is first called and never before, and without it, or with
# one outside these bounds, those two say what to install.
[project.optional-dependencies]
numpy = ["numpy>=2.0,<3"]

[dependency-groups]
test = ["pytest>=9"]
# The oldest NumPy the extra takes, which the tests run on once beside the
# newest: on the oldest Python, which it has a wheel for, as it has none for
# the newest.
oldest-numpy = ["numpy==2.0.0"]

# The tests run against the installed package (docs/python-package.md).
[tool.pytest.ini_options]
minversion = "9"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
# Some tests wait on another thread. One that waits for good ends the run
# after this many seconds, with every thread's traceback, instead of holding
# the job until its own limit; pytest exits on a timeout from 9.0 on.
faulthandler_timeout = 60
faulthandler_exit_on_timeout = true

[tool.maturin]
# The package is `python/quantforge_py/`, and the extension module is built
# into it as `quantforge_py._native`.
python-source = "python"
module-name = "quantforge_py._native"
# As everywhere in the repository: the build fails on a lock file that is not
# up to date instead of rewriting it.
locked = true
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]
